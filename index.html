<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <meta name="authors" content="Ana Livia, Bryan Siqueira, Laura Fireman, Nicolas Phellipe, Júlio César">
    <title>LaurAna Pizzaria</title>

    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS próprio -->
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <!-- HEADER -->
    <header class="header">

        <div class="container">

            <div class="header-conteudo">

                <div class="logo-area">

                    <img src="static/img/logo.png" alt="Logo da pizzaria LaurAna">

                    <div class="logo-texto">
                        <h1>LaurAna</h1>
                        <p>Pizzaria Italiana</p>
                    </div>

                </div>

                <nav class="menu">

                    <a href="#" target="_self">
                        <i class="bi bi-house"></i>
                        Início
                    </a>

                    <a href="paginas/cardapio.html" target="_self">
                        <i class="bi bi-book"></i>
                        Cardápio
                    </a>

                    <a href="/paginas/pedidos.html" target="_self">
                        <i class="bi bi-cart3"></i>
                        Pedidos
                    </a>

                    <a href="paginas/conta.html" target="_self">
                        <i class="bi bi-person"></i>
                        Conta
                    </a>

                </nav>

            </div>

        </div>

    </header>
    <!-- MAIN -->
    <main class="main">
        <div class="container">
            <div class="apresentacao">
                <h2>Bem-vindo à LaurAna!</h2>
                <p>
                    Sabores tradicionais da Itália preparados
                    com carinho para você.
                </p>
            </div>

            <!-- BOTÕES -->
            <div class="botoes-navegacao">
                <a href="paginas/cardapio.html" class="botao">
                    <i class="bi bi-book"></i>
                    <span>Cardápio</span>
                </a>

                <a href="paginas/pedidos.html" class="botao">
                    <i class="bi bi-cart3"></i>
                    <span>Pedidos</span>
                </a>

                <a href="paginas/conta.html" class="botao">
                    <i class="bi bi-person"></i>
                    <span>Conta</span>
                </a>
            </div>
        </div>

        <div class="container-fluid my-5 p-0">
            <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                    <img src="static/img/banner/1.jpg" class="d-block w-100" alt="..." height="500">
                    </div>
                    <div class="carousel-item">
                        <img  src="static/img/banner/2.jpg" class="d-block w-100" alt="..." height="500">
                    </div>
                    <div class="carousel-item">
                        <img src="static/img/banner/3.jpg" class="d-block w-100" alt="..." height="500">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div class="container">
            <img src="static/img/logo.png" class="text-center my-3">
            <h3>LaurAna Pizzaria</h3>
            <p>
                Pizza artesanal com sabor e tradição italiana.
            </p>

            <div class="redes">

                <a href="#">
                    <i class="bi bi-instagram"></i>
                </a>

                <a href="#">
                    <i class="bi bi-facebook"></i>
                </a>

                <a href="#">
                    <i class="bi bi-whatsapp"></i>
                </a>

            </div>

            <hr>

            <p class="copyright">
                © 2026 LaurAna Pizzaria - Todos os direitos reservados.
            </p>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>

</html>
